<form id="frm" class="form" [formGroup]="frm" novalidate>
  <h1 class="title-bloc">Add new client</h1>
  <mat-tab-group mat-stretch-tabs dynamicHeight>
    <mat-tab label="Personal Informations">
      <div class="form">

        <table>
          <tr>
            <td>
              <mat-form-field appearance="fill"[style.width.px]="300">
                <mat-label>Reference number</mat-label>
                <input matInput placeholder="Reference number" [formControl]="ctlReferenceNumber"/>
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill">
              <mat-label>Social Security Number</mat-label>
              <input
                matInput
                placeholder="Ssn"
                [formControl]="ctlSsn"
              />
            </mat-form-field>
            </td>
          </tr>
        </table>

        <table>
          <tr>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="100">
                <mat-label>Sex</mat-label>
                <mat-select
                  placeholder="Gender"
                  [formControl]="ctlGender"
                  required
                >
                  <mat-option *ngFor="let element of status" [value]="element.id">
                    {{ element.value }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill">
                <mat-label>Firstname</mat-label>
                <input matInput placeholder="Firstname" [formControl]="ctlFirstName" required />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill">
                <mat-label>Lastname</mat-label>
                <input matInput placeholder="Firstname" [formControl]="ctlLastName" required />
              </mat-form-field>
            </td>
          </tr>
          </table>

        <mat-form-field appearance="fill">
          <mat-label>Date of Birth</mat-label>
          <input matInput placeholder="Date of birth"  name="startDate" [formControl]="ctlBirthDate" [matDatepicker]="startdatepicker" required>
          <mat-datepicker-toggle matIconSuffix [for]="startdatepicker"></mat-datepicker-toggle>
          <mat-datepicker  [dateClass]="" #startdatepicker></mat-datepicker>
        </mat-form-field>

        <table>
          <tr>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="300" >
                <mat-label>Place of Birth</mat-label>
                <input matInput placeholder="PlaceOfBirth" [formControl]="ctlPlaceOfBirth" />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill">
                <mat-label>Nationality</mat-label>
                <input matInput placeholder="Nationality" [formControl]="ctlNationality" />
              </mat-form-field>
            </td>
          </tr>
        </table>

      </div>
    </mat-tab>
    <mat-tab label="Contact details">
      <div class="form">
        <br />
        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input
            matInput
            placeholder="Email"
            [formControl]="ctlEmail"
          />

        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Phone</mat-label>
          <input
            matInput
            placeholder="Phone"
            [formControl]="ctlPhone"
          />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Mobile phone</mat-label>
          <input
            matInput
            placeholder="MobilePhone"
            [formControl]="ctlMobilePhone"
          />
        </mat-form-field>

        <table>
          <tr>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="100">
                <mat-label>Number</mat-label>
                <input
                  type="number"
                  matInput
                  placeholder="Number"
                  [formControl]="ctlAddressStreetNumber"
                />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="100">
                <mat-label>P.O. Box</mat-label>
                <input
                  matInput
                  placeholder="PostalBoxNumber"
                  [formControl]="ctlAddressBoxNumber"
                />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="300">
                <mat-label>Street</mat-label>
                <input
                  matInput
                  placeholder="Address"
                  [formControl]="ctlAddressStreet"
                />
              </mat-form-field>
            </td>
          </tr>
        </table>

        <table>
          <tr>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="350">
                <mat-label>City</mat-label>
                <input
                  matInput
                  placeholder="City"
                  [formControl]="ctlAddressCity"
                />
              </mat-form-field>
            </td>
            <td>
              <mat-form-field appearance="fill" [style.width.px]="150">
                <mat-label>Postal code</mat-label>
                <input
                  type="number"
                  matInput
                  placeholder="Code postal"
                  [formControl]="ctlAddressPostalCode"
                />
              </mat-form-field>
            </td>
          </tr>
        </table>
      </div>
    </mat-tab>
  </mat-tab-group>
  <div class="footer">
    <button type="reset" mat-button (click)="cancel()">Cancel</button>
    <button
    type="submit"
    mat-button
    form="frm"
    [disabled]="frm.pristine || frm.invalid || frm.pending"
    (click)="save()"
  >
    Save
  </button>
  </div>
</form>
